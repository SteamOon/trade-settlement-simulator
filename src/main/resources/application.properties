spring.application.name=trade-settlement-simulator

spring.config.import=optional:configtree:./secrets/
spring.datasource.url=jdbc:postgresql://localhost:5432/tss
spring.datasource.username=tss_user
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.settlement.fixed-delay-ms=60000
