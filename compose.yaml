
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tss
      POSTGRES_USER: tss_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/spring.datasource.password
